<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Kalkulator-Remastered</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="kalkulator">
            <div class="display">
                <input type="text" style="--size:100%; --color:gray" id="hitung">
                <input type="text" style="--size:200%; --color:black" id="hasil">
            </div>
            <div class="row">
                <div class="kotak" style="--warna:gray" onclick="hapusSemua()">C</div>
                <div class="kotak" style="--warna:gray" onclick="hapusAngka()">CE</div>
                <div class="kotak" style="--warna:pink" onclick="inputOperator('%')">%</div>
                <div class="kotak" style="--warna:green" onclick="inputOperator('/')">:</div>
            </div>
            <div class="row">
                <div class="kotak" onclick="inputAngka('7')">7</div>
                <div class="kotak" onclick="inputAngka('8')">8</div>
                <div class="kotak" onclick="inputAngka('9')">9</div>
                <div class="kotak" style="--warna:orange" onclick="inputOperator('*')">x</div>
            </div>
            <div class="row">
                <div class="kotak" onclick="inputAngka('4')">4</div>
                <div class="kotak" onclick="inputAngka('5')">5</div>
                <div class="kotak" onclick="inputAngka('6')">6</div>
                <div class="kotak" style="--warna:red" onclick="inputOperator('-')">-</div>
            </div>
            <div class="row">
                <div class="kotak" onclick="inputAngka('1')">1</div>
                <div class="kotak" onclick="inputAngka('2')">2</div>
                <div class="kotak" onclick="inputAngka('3')">3</div>
                <div class="kotak" style="--warna:blue" onclick="inputOperator('+')">+</div>
            </div>
            <div class="row">
                <div class="kosongan"></div>
                <div class="kotak" onclick="inputAngka('0')">0</div>
                <div class="kosongan"></div>
                <div class="kotak" style="--warna:gray" onclick="hasilHitung()">=</div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
